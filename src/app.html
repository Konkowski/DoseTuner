<body>
<header class="top">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3.2 4.6-5.5 7.4-5.5 10.6a5.5 5.5 0 0 0 11 0C17.5 10.4 15.2 7.6 12 3z"/><path d="M9.5 14.2h5"/></svg></div>
  <div class="brand">DOSE TUNER</div><div class="sp"></div><span class="chip" id="chip" hidden></span>
  <button class="iconbtn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
</header>
<nav class="steps" id="steps" aria-label="Steps"></nav>
<div class="strip" id="strip"><div></div></div>
<main id="app"></main>
<input type="file" id="file" hidden accept=".csv,.txt,.tsv,text/csv,text/plain,text/tab-separated-values">
<script>
/*__CORE__*/
</script>
<script>
'use strict';
const C = DoseCore;
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f0 = x => Math.round(x).toLocaleString('en-US'), f1 = x => (Math.round(x * 10) / 10).toFixed(1), f2 = x => (Math.round(x * 100) / 100).toFixed(2), pc = x => (x * 100).toFixed(x > 0 && x < 0.1 ? 1 : 0);
const sg = (x, d) => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(d == null ? 1 : d), cpf = x => x >= 5 ? '5+' : x.toFixed(2), clampv = (x, a, b) => Math.min(b, Math.max(a, x));
const sig3 = x => { const v = +Number(x).toPrecision(3); return Math.abs(v) >= 1000 ? f0(v) : String(v); };
const ST = { view: 'data', settings: Object.assign({}, C.DEFAULTS), parsed: null, map: {}, tol: null, info: null, records: [], results: [], summary: null, simulated: false, headSel: null, busy: null, log: [], saved: null, fileName: '', pasted: '', mode: 'full', dev: null, stale: false, rawText: '', unit: 'pct', unitOverride: 'auto' };
const STATUS = { ok: 'On target', adjust: 'Adjust', check: 'Check head', wait: 'Collecting data' };
const VARS = { Q: 'Flow', rho: 'Density', T: 'Temperature', P: 'Pressure' };
const PCT = () => ST.unit === 'pct';
const lvl = a => PCT() ? (100 - a).toFixed(2) + ' %' : f1(a) + ' ms';      /* a = internal value; in % mode the closing point is 100 - a */
const lvn = a => PCT() ? (100 - a).toFixed(2) : f1(a), dlt = d => PCT() ? sg(-d, 2) : sg(d, 1), UT = () => PCT() ? '%' : 'ms';
const AV = p => PCT() ? p.c : p.a, AD = p => PCT() ? p.cDyn : p.aDyn, AN = r => PCT() ? r.cNow : r.aNow, AW = r => PCT() ? r.cNew : r.aNew;
const UNM = () => PCT() ? 'closing point' : 'anticipation', KC = t => PCT() ? t.kc : t.k;
const detect = () => ST.unitOverride !== 'auto' ? ST.unitOverride : C.detectUnit(ST.parsed, ST.map);
const PA = r => (ST.mode === 'fixed' ? (r.afterFixed || r.after) : r.after), SA = sm => (ST.mode === 'fixed' ? sm.afterFixed : sm.after);
const PW = (s) => (ST.mode === 'fixed' ? s.wFix : s.wDyn);

/* ---------- storage (best effort; the phone may clear it) ---------- */
function idb() { return new Promise((res, rej) => { try { const q = indexedDB.open('dosetuner', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); } catch (e) { rej(e); } }); }
async function kvSet(k, v) { try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; } catch (e) { return false; } }
async function kvGet(k) { try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return null; } }
async function kvDel(k) { try { const db = await idb(); await new Promise(res => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = res; tx.onerror = res; }); } catch (e) {} }
const snap = () => ({ settings: ST.settings, tol: ST.tol, map: ST.map, log: ST.log });
function saveSession() { if (ST.rawText && ST.rawText.length < 40e6) kvSet('session', Object.assign({ text: ST.rawText, name: ST.fileName, savedAt: Date.now() }, snap())); }
function saveMeta() { kvGet('session').then(s => { if (s) kvSet('session', Object.assign(s, snap())); }); }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
function showText(title, text) {
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = '<div class="panel"><h2>' + esc(title) + '</h2><textarea readonly rows="10" id="mt" class="mono">' + esc(text) + '</textarea><div class="row"><button class="btn pri" id="mc">Copy</button><button class="btn" id="mx">Close</button></div><p class="small mute">If Copy is blocked on your phone, press and hold the text to select and copy it.</p></div>';
  document.body.appendChild(m); const ta = m.querySelector('#mt'); ta.focus(); ta.select();
  m.querySelector('#mx').onclick = () => m.remove();
  m.querySelector('#mc').onclick = async () => { try { await navigator.clipboard.writeText(text); toast('Copied'); } catch (e) { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e2) { toast('Select the text and copy it manually'); } } };
}

/* ---------- names and units from the CSV header ---------- */
const UNITS = { ml: 'ml', s: 's', g: 'g', c: '°C', degc: '°C', bar: 'bar', mbar: 'mbar', kpa: 'kPa', pa: 'Pa', psi: 'psi', ms: 'ms', kg: 'kg', l: 'l', mls: 'ml/s', gml: 'g/ml', lmin: 'l/min' };
function colName(k) { return ST.parsed && ST.map[k] != null ? ST.parsed.header[ST.map[k]] : VARS[k] || k; }
function unitOf(k) { const h = colName(k), br = h.match(/[\[(]([^\])]+)[\])]/); if (br) return br[1]; const tok = h.toLowerCase().split(/[\s_\-.\/]+/).filter(Boolean), u = []; while (tok.length > 1 && UNITS[tok[tok.length - 1]]) u.unshift(UNITS[tok.pop()]); return u.join('/'); }
const vName = k => VARS[k] || k;

/* ---------- pipeline ---------- */
function loadText(text, name, simulated) {
  const parsed = C.parseCSV(text);
  if (!parsed.rows.length || parsed.header.length < 3) { toast('That does not look like a CSV table'); return false; }
  Object.assign(ST, { parsed, map: C.guessMapping(parsed.header), unitOverride: 'auto', fileName: name, simulated: !!simulated, rawText: text, results: [], summary: null, stale: false, tol: null, dev: null, view: 'data' });
  ST.unit = detect(); if (!C.missingRequired(ST.map, ST.unit).length) prepare(); return true;
}
function prepare() {
  ST.unit = detect(); const b = C.buildRecords(ST.parsed, ST.map, { delay: 0, state: null, unit: ST.unit }); ST.info = b.info;
  const t1 = C.median(b.records.map(r => r.t1)), t2 = C.median(b.records.map(r => r.t2));
  if (!ST.tol) ST.tol = { t1: +t1.toFixed(2), t2: +t2.toFixed(2), file: { t1: +t1.toFixed(2), t2: +t2.toFixed(2) }, user: false };
  ST.dev = b.records.filter(r => isFinite(r.w)).map(r => r.w - r.target);
}
function rebuild() { ST.unit = detect(); const o = { delay: 0, state: null, unit: ST.unit }; if (ST.tol && ST.tol.user) { o.t1Abs = ST.tol.t1; o.t2Abs = ST.tol.t2; } const b = C.buildRecords(ST.parsed, ST.map, o); ST.records = b.records; ST.info = b.info; }
async function runAnalysis() {
  rebuild(); ST.view = 'busy'; ST.busy = { i: 0, n: 1 }; render();
  const by = C.groupByHead(ST.records), heads = Object.keys(by).map(Number).sort((a, b) => a - b), out = [];
  if (!heads.length) { ST.view = 'data'; ST.busy = null; render(); toast('No usable rows – check the column mapping'); return; }
  for (let i = 0; i < heads.length; i++) {
    ST.busy = { i, n: heads.length, head: heads[i] }; render(); await new Promise(r => setTimeout(r, 25));
    by[heads[i]].sort((a, b) => a.idx - b.idx);
    try { out.push(C.analyzeHead(by[heads[i]], ST.settings)); } catch (e) { out.push({ head: heads[i], status: 'wait', mode: 'none', action: 'none', headline: 'Could not analyse this head', advice: String(e.message || e), checks: [], vars: [], reasons: [], stats: { n: 0 }, aNow: NaN, aNew: NaN, delta: 0, trace: [], reason: 'Analysis error.' }); }
  }
  ST.results = out; ST.summary = C.summarize(out); ST.busy = null; ST.stale = false; ST.view = 'result'; render(); window.scrollTo(0, 0);
  if (!ST.simulated) saveSession();
}
async function runDemo() {
  const p = C.simulateHistory({ seed: 5, nCycles: 300, scenario: 'dynamic', swing: 1.5, saw: 0.7, closeUnit: 'pct' });
  if (loadText(p.toCSV({ plcAligned: true }), 'Simulated demo machine', true)) await runAnalysis();
}

/* ---------- chart helpers ---------- */
const CH = {};   // scrub charts registry
const CW = () => Math.max(280, Math.min(app.clientWidth - 32, 948) - 34);
function niceStep(range, n) { const r = range / n, p = Math.pow(10, Math.floor(Math.log10(r))), m = r / p; return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p; }
function ticks(lo, hi, n) { const st = niceStep(hi - lo, n), out = []; for (let v = Math.ceil(lo / st) * st; v <= hi + 1e-9; v += st) out.push(+v.toFixed(10)); return out; }
const svgOpen = (W, H, aria, cls, extra) => '<svg class="ch ' + (cls || '') + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '" ' + (extra || '') + '>';
const legendItem = (kind, color, label) => '<span><i class="' + kind + '" style="background:' + color + '"></i>' + label + '</span>';

/* Process window: where each head's bottles fall, now vs proposed (average ± 2σ), against the tolerance limits */
function chartWindow(rs) {
  const rows = rs.filter(r => r.before && r.status !== 'wait'); if (!rows.length) return '';
  const W = CW(), L = 34, R = 92, T = 34, bh = 7, blk = 36, H = T + rows.length * blk + 6, t1 = rows[0].stats.t1, t2 = rows[0].stats.t2;
  const ext = Math.max(...rows.flatMap(r => [r.before, PA(r)].map(s => Math.abs(s.err) + 2 * s.sd))), lim = Math.max(t1 * 1.35, Math.min(ext * 1.1, t2 * 1.25)), x = v => L + (W - L - R) * (0.5 + clampv(v, -lim, lim) / (2 * lim));
  let g = '<rect x="' + x(-t1) + '" y="' + (T - 6) + '" width="' + (x(t1) - x(-t1)) + '" height="' + (rows.length * blk + 4) + '" fill="var(--teal)" opacity=".08"/>';
  [-t2, t2].filter(v => Math.abs(v) <= lim).forEach(v => { g += '<line x1="' + x(v) + '" x2="' + x(v) + '" y1="' + (T - 6) + '" y2="' + (H - 2) + '" stroke="var(--amber)" opacity=".75"/>'; });
  g += '<line x1="' + x(-t1) + '" x2="' + x(-t1) + '" y1="' + (T - 6) + '" y2="' + (H - 2) + '" stroke="var(--teal)" opacity=".5"/><line x1="' + x(t1) + '" x2="' + x(t1) + '" y1="' + (T - 6) + '" y2="' + (H - 2) + '" stroke="var(--teal)" opacity=".5"/><line x1="' + x(0) + '" x2="' + x(0) + '" y1="' + (T - 8) + '" y2="' + (H - 2) + '" stroke="var(--text)" opacity=".6"/>';
  [[-t1, '−T1'], [0, 'target'], [t1, '+T1']].forEach(a => { g += '<text x="' + x(a[0]) + '" y="' + (T - 14) + '" text-anchor="middle">' + a[1] + '</text>'; });
  if (t2 <= lim) g += '<text x="' + x(t2) + '" y="' + (T - 14) + '" text-anchor="middle" style="fill:var(--amber)">+T2</text><text x="' + x(-t2) + '" y="' + (T - 14) + '" text-anchor="middle" style="fill:var(--amber)">−T2</text>';
  g += '<text x="' + L + '" y="' + (H + 12) + '" style="font-size:10.5px">← lighter</text><text x="' + (W - R) + '" y="' + (H + 12) + '" text-anchor="end" style="font-size:10.5px">heavier →</text>';
  rows.forEach((r, i) => { const y = T + i * blk, b = r.before, a = PA(r), i0 = ST.results.indexOf(r);
    const one = (s, yy, col) => '<rect x="' + x(s.err - 2 * s.sd) + '" y="' + yy + '" width="' + Math.max(2, x(s.err + 2 * s.sd) - x(s.err - 2 * s.sd)) + '" height="' + bh + '" rx="3.5" fill="' + col + '" opacity="' + (col === 'var(--teal)' ? 1 : .8) + '"/><circle cx="' + x(s.err) + '" cy="' + (yy + bh / 2) + '" r="4.5" fill="' + col + '" stroke="var(--panel)" stroke-width="2"/>';
    g += '<g data-act="head" data-i="' + i0 + '" style="cursor:pointer"><rect x="0" y="' + (y - 4) + '" width="' + W + '" height="' + (blk - 2) + '" fill="transparent"/><text x="' + (L - 8) + '" y="' + (y + 16) + '" text-anchor="end" class="mono tx" style="font-size:12px">H' + r.head + '</text>' + one(b, y + 2, 'var(--gray)') + one(a, y + 15, 'var(--teal)') +
      '<text x="' + (W - R + 10) + '" y="' + (y + 11) + '" class="mono" style="font-size:11px">Cpk ' + cpf(b.cpk) + '</text><text x="' + (W - R + 10) + '" y="' + (y + 24) + '" class="mono tx" style="font-size:11px">→ ' + cpf(a.cpk) + '</text></g>'; });
  return svgOpen(W, H + 16, 'Process window of each head: average and plus or minus two standard deviations, now and proposed, against tolerance limits') + g + '</svg>' +
    '<div class="legend">' + legendItem('dot', 'var(--gray)', 'Now (dot = average, bar = ±2σ)') + legendItem('dot', 'var(--teal)', 'Proposed') + legendItem('sq', 'rgba(45,212,191,.25)', 'Inside T1') + legendItem('', 'var(--amber)', 'T2') + '</div>';
}

/* Capability index per head: now, proposed (bars) and the goal after all rounds (ring) */
function chartCpk(rs) {
  const rows = rs.filter(r => r.before && r.status !== 'wait'); if (!rows.length) return '';
  const W = CW(), L = 34, R = 78, T = 22, blk = 30, H = T + rows.length * blk + 8, mx = clampv(Math.ceil(Math.max(2, ...rows.map(r => Math.max(r.before.cpk, PA(r).cpk, r.goal ? r.goal.cpk : 0))) * 2) / 2, 2, 4), x = v => L + (W - L - R) * Math.min(v, mx) / mx;
  let g = ticks(0, mx, 4).map(v => '<line x1="' + x(v) + '" x2="' + x(v) + '" y1="' + (T - 4) + '" y2="' + (H - 6) + '" stroke="var(--line)"/><text x="' + x(v) + '" y="' + (T - 9) + '" text-anchor="middle" style="font-size:10.5px">' + v + '</text>').join('');
  [[1, '1.0'], [1.33, '1.33']].forEach(a => { g += '<line x1="' + x(a[0]) + '" x2="' + x(a[0]) + '" y1="' + (T - 4) + '" y2="' + (H - 6) + '" stroke="' + (a[0] > 1 ? 'var(--teal)' : 'var(--amber)') + '" opacity=".75"/>'; });
  rows.forEach((r, i) => { const y = T + i * blk, b = r.before, a = PA(r), i0 = ST.results.indexOf(r), bar = (v, yy, col) => '<rect x="' + L + '" y="' + yy + '" width="' + Math.max(2, x(v) - L) + '" height="8" rx="4" fill="' + col + '"/>';
    g += '<g data-act="head" data-i="' + i0 + '" style="cursor:pointer"><rect x="0" y="' + (y - 3) + '" width="' + W + '" height="' + (blk - 2) + '" fill="transparent"/><text x="' + (L - 8) + '" y="' + (y + 15) + '" text-anchor="end" class="mono tx" style="font-size:12px">H' + r.head + '</text>' + bar(b.cpk, y + 1, 'var(--gray)') + bar(a.cpk, y + 12, 'var(--teal)') +
      '<text x="' + (W - R + 10) + '" y="' + (y + 15) + '" class="mono" style="font-size:11px">' + cpf(b.cpk) + ' <tspan class="tx" style="font-weight:600">→ ' + cpf(a.cpk) + '</tspan></text>' +
      (r.goal ? '<circle cx="' + x(r.goal.cpk) + '" cy="' + (y + 15) + '" r="5" fill="none" stroke="var(--text)" stroke-width="1.6"/>' : '') + '</g>'; });
  g += '<text x="' + x(1) + '" y="' + (H) + '" text-anchor="middle" style="font-size:10px;fill:var(--amber)">1.0</text><text x="' + x(1.33) + '" y="' + (H) + '" text-anchor="start" style="font-size:10px;fill:var(--teal2)"> 1.33 capable</text>';
  return svgOpen(W, H + 8, 'Process capability index Cpk of each head, now, proposed and goal') + g + '</svg><div class="legend">' + legendItem('sq', 'var(--gray)', 'Now') + legendItem('sq', 'var(--teal)', 'Proposed') + '<span><i class="dot" style="background:none;border:2px solid var(--text)"></i>Goal after all rounds</span></div>';
}

/* Where the squared weight error comes from: offset from target, conditions (can be compensated), unexplained spread */
function decompSum(rs, key) {
  const t = { bias2: 0, cond: 0, noise: 0 }; let w = 0;
  rs.forEach(r => { if (!r.before || r.status === 'wait') return; const n = r.before.n; let d = r.decomp && r.decomp[key]; if (!d) { const s = key === 'before' ? r.before : (key === 'goal' ? r.goal : PA(r)); d = { bias2: s.err * s.err, cond: 0, noise: s.sd * s.sd }; }
    t.bias2 += n * d.bias2; t.cond += n * d.cond; t.noise += n * d.noise; w += n; });
  return w ? { bias2: t.bias2 / w, cond: t.cond / w, noise: t.noise / w } : null;
}
function chartDecomp(rows) {
  rows = rows.filter(r => r.d); if (!rows.length) return '';
  const W = CW(), L = 78, R = 100, T = 8, blk = 40, H = T + rows.length * blk + 4, tot = d => d.bias2 + d.cond + d.noise, mx = Math.max(...rows.map(r => tot(r.d))) || 1, x = v => (W - L - R) * v / mx;

  else if (a === 'abest') { const r = anaHead(); if (r) { anaState(r); ST.ana.d0 = 0; ST.ana.d1 = 0; anaRedraw(r, true); } }
  else if (a === 'astep') { ST.stepI = +b.dataset.i; const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (a === 'back') { ST.view = 'heads'; render(); }
  else if (a === 'copyone') { const r = ST.results[ST.headSel]; showText('Head ' + r.head, plcText(r)); }
  else if (a === 'copyall') showText('All heads', allText());
  else if (a === 'applied') { const r = ST.results[ST.headSel]; ST.log.push({ head: r.head, from: r.aNow, to: r.aNew, t: Date.now() }); saveMeta(); toast('Noted. Reload newer data after these bottles are weighed.'); }
  else if (a === 'mark') { const r = ST.results.find(x => x.head === +b.dataset.h); ST.log.push({ head: r.head, from: r.aNow, to: r.aNew, t: Date.now() }); saveMeta(); render(); }
  else if (a === 'saveset') { readSettings(); saveMeta(); if (ST.parsed) runAnalysis(); else { ST.view = 'data'; render(); toast('Saved'); } }
  else if (a === 'reset') { ST.settings = Object.assign({}, C.DEFAULTS); render(); toast('Defaults restored'); }
  else if (a === 'forget') { kvDel('session'); ST.saved = null; toast('Deleted'); }
});
function anaHead() { const el = $('#ana'); if (!el) return null; return ST.results.find(r => r.head === +el.dataset.head); }
function anaRedraw(r, full) { const el = $('#ana'); if (!el) return; if (full) { const y = window.scrollY; el.outerHTML = anatomyBlock(r); window.scrollTo(0, y); } else { const S = anaState(r); $('#anaPlot').innerHTML = anaPlot(r, S); } }
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.ana) { const r = anaHead(); if (!r) return; anaState(r); ST.ana[t.dataset.ana] = parseFloat(t.value) || 0; anaRedraw(r, false); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'anapick') { ST.anaPick = +t.value; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.id === 'file') { const f = t.files && t.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { if (loadText(String(rd.result), f.name, false)) render(); }; rd.onerror = () => toast('Could not read that file'); rd.readAsText(f); t.value = ''; }
  else if (t.dataset && t.dataset.map) { const k = t.dataset.map; if (t.value === '') delete ST.map[k]; else ST.map[k] = parseInt(t.value, 10); ST.tol = null; ST.unit = detect(); if (!C.missingRequired(ST.map, ST.unit).length) prepare(); render(); }
  else if (t.id === 'unitsel') { ST.unitOverride = t.value; ST.unit = detect(); ST.tol = null; if (!C.missingRequired(ST.map, ST.unit).length) prepare(); render(); }
  else if (t.id === 'tol_t1' || t.id === 'tol_t2') { const v = parseFloat(t.value); if (isFinite(v) && v > 0 && ST.tol) { if (t.id === 'tol_t1') { ST.tol.t1 = v; if (ST.tol.t2 <= v) ST.tol.t2 = +(v * 2).toFixed(2); } else ST.tol.t2 = Math.max(v, ST.tol.t1 + 0.05); ST.tol.user = true; ST.stale = true; saveMeta(); render(); } }
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (Math.abs(app.clientWidth - lastW) > 12 && ['result', 'head', 'data'].includes(ST.view)) { const y = window.scrollY; render(); window.scrollTo(0, y); } }, 150); });
kvGet('session').then(s => { if (s && s.text) { ST.saved = s; if (ST.view === 'data' && !ST.parsed) render(); } });
window.__app = { ST, C, loadText, runAnalysis, render, runDemo };
render();
